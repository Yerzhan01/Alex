<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skinGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fdbcb4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ea907a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="hairGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b4513;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#654321;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="60" cy="60" r="58" fill="#00a651" stroke="#ffffff" stroke-width="4"/>
  
  <!-- Head -->
  <circle cx="60" cy="45" r="25" fill="url(#skinGradient)"/>
  
  <!-- Hair -->
  <path d="M35 35 Q60 25 85 35 Q85 20 60 20 Q35 20 35 35" fill="url(#hairGradient)"/>
  
  <!-- Eyes -->
  <circle cx="52" cy="42" r="3" fill="#2c3e50"/>
  <circle cx="68" cy="42" r="3" fill="#2c3e50"/>
  <circle cx="53" cy="41" r="1" fill="#ffffff"/>
  <circle cx="69" cy="41" r="1" fill="#ffffff"/>
  
  <!-- Nose -->
  <ellipse cx="60" cy="48" rx="1.5" ry="2" fill="#d4917a"/>
  
  <!-- Mouth -->
  <path d="M55 52 Q60 55 65 52" stroke="#2c3e50" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  
  <!-- Body -->
  <rect x="45" y="70" width="30" height="35" rx="15" fill="#00a651"/>
  
  <!-- Arms -->
  <circle cx="35" cy="80" r="8" fill="url(#skinGradient)"/>
  <circle cx="85" cy="80" r="8" fill="url(#skinGradient)"/>
  
  <!-- Stethoscope -->
  <path d="M50 85 Q60 90 70 85" stroke="#2c3e50" stroke-width="2" fill="none"/>
  <circle cx="60" cy="90" r="3" fill="#2c3e50"/>
  
  <!-- Medical cross on shirt -->
  <rect x="58" y="78" width="4" height="8" fill="#ffffff"/>
  <rect x="56" y="80" width="8" height="4" fill="#ffffff"/>
</svg>